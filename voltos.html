<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ VoltOS 6.3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --accent: #ffd700; --accent2: #ff8c00;
    --bg: #0a0a12; --panel: rgba(18,18,28,.97);
    --border: rgba(255,215,0,.25);
    --text: #e0e0e0; --text-dim:#888; --text-mute:#555;
    --glass: rgba(18,18,28,.72);
    --shadow: 0 12px 48px rgba(0,0,0,.7);
    --radius: 12px;
  }
  body.amoled { --bg:#000; --panel:rgba(8,8,12,.98); --border:rgba(255,215,0,.18); --glass:rgba(0,0,0,.78); }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#000; overflow:hidden;
    height:100vh; user-select:none; color:var(--text); -webkit-font-smoothing:antialiased; }

  /* === BOOT === */
  #boot { position:fixed; inset:0; background:#000; z-index:99999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .8s cubic-bezier(.4,0,.2,1); }
  #boot.done { opacity:0; pointer-events:none; }
  .bolt { font-size:90px; animation:bootPulse 1.2s ease-in-out infinite; filter:drop-shadow(0 0 40px #ffd700); }
  @keyframes bootPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.18);opacity:.7} }
  #boot h1 { font-size:48px; letter-spacing:12px; margin:20px 0 10px;
    background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 2s linear infinite; font-weight:300; }
  @keyframes shine { to { background-position:200% center; } }
  #boot p { color:#444; font-size:12px; letter-spacing:4px; }
  .boot-bar { width:320px; height:3px; background:#111; border-radius:2px; margin-top:36px; overflow:hidden; }
  .boot-bar-fill { height:100%; width:0; background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);
    background-size:200% auto; transition:width .2s; box-shadow:0 0 20px #ffd700; animation:shine 1s linear infinite; }
  #bootlog { position:absolute; bottom:30px; left:30px; font-family:'Consolas',monospace;
    font-size:11px; color:#333; line-height:1.7; max-width:400px; }

  /* === GLITCH OVERLAY === */
  #glitchOverlay { position:fixed; inset:0; z-index:99990; pointer-events:none;
    display:none; mix-blend-mode:screen; opacity:.15; }
  #glitchOverlay.active { display:block; }
  body.glitched { animation:glitchShift 5s infinite; }
  @keyframes glitchShift {
    0%,100% { filter:none; transform:translate(0); }
    10% { filter:hue-rotate(90deg) saturate(2); transform:translate(-3px, 2px); }
    20% { filter:invert(1) hue-rotate(180deg); transform:translate(2px, -1px); }
    30% { filter:none; transform:translate(0); }
    50% { filter:contrast(2) brightness(.8); transform:translate(4px, 0); }
    60% { filter:hue-rotate(-90deg); transform:translate(-2px, 1px); }
    70% { filter:none; transform:translate(0); }
  }
  .glitch-artifact { position:absolute; z-index:50; pointer-events:none;
    background:rgba(255,215,0,.4); box-shadow:0 0 20px rgba(255,0,255,.5);
    animation:artifactFlicker 3s infinite; }
  @keyframes artifactFlicker { 0%,100%{opacity:.1} 50%{opacity:.7} }
  .glitch-text { color:#f0f; font-family:'Consolas',monospace; text-shadow:2px 0 red, -2px 0 cyan;
    animation:glitchText 1s infinite; }
  @keyframes glitchText {
    0%,100%{transform:translate(0)} 25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-1px)} 75%{transform:translate(-1px,2px)}
  }

  /* === DESKTOP === */
  #desktop { position:fixed; inset:0; opacity:0; transition:opacity .8s cubic-bezier(.4,0,.2,1);
    background:radial-gradient(circle at 30% 20%, #1a1a2e 0%, #0a0a12 60%, #000 100%);
    background-size:cover; background-position:center; }
  #desktop.show { opacity:1; }
  #desktop.dragover::after { content:'📤 Отпусти чтобы загрузить'; position:absolute; inset:12px;
    border:3px dashed var(--accent); border-radius:16px; background:rgba(255,215,0,.1);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    color:var(--accent); font-weight:bold; z-index:9000; backdrop-filter:blur(4px); pointer-events:none; }

  /* === TOPBAR === */
  #topbar { position:absolute; top:0; left:0; right:0; height:36px;
    background:var(--glass); backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--border); display:flex; align-items:center;
    padding:0 14px; font-size:12px; gap:12px; z-index:5000; }
  #topbar .logo { color:var(--accent); font-weight:700; letter-spacing:1.5px;
    cursor:pointer; display:flex; align-items:center; gap:6px; transition:.2s; }
  #topbar .logo:hover { transform:scale(1.05); }
  #topbar .spacer { flex:1; }
  #topbar .stat { color:#777; display:flex; align-items:center; gap:5px; transition:.2s;
    padding:2px 6px; border-radius:6px; }
  #topbar .stat:hover { background:rgba(255,255,255,.05); }
  #topbar .stat b { color:var(--accent); font-weight:600; }
  .pill { padding:3px 12px; border-radius:14px; font-size:11px; cursor:pointer; transition:.2s; font-weight:500; }
  .mode-pill { border:1px solid rgba(255,215,0,.3); background:rgba(255,215,0,.08); color:var(--accent); }
  .mode-pill:hover { background:rgba(255,215,0,.2); transform:translateY(-1px); }
  .user-pill { border:1px solid rgba(80,200,255,.3); background:rgba(80,200,255,.08); color:#50c8ff; }
  .user-pill:hover { background:rgba(80,200,255,.2); transform:translateY(-1px); }
  .vdots { display:flex; gap:5px; }
  .vdot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.15);
    cursor:pointer; transition:.25s; }
  .vdot:hover { background:rgba(255,255,255,.3); transform:scale(1.2); }
  .vdot.active { background:var(--accent); box-shadow:0 0 10px var(--accent); transform:scale(1.3); }

  .battery { width:36px; height:15px; border:1.5px solid #666; border-radius:4px; position:relative; padding:1.5px; }
  .battery::after { content:''; position:absolute; right:-3px; top:4px; width:2px; height:5px;
    background:#666; border-radius:0 1px 1px 0; }
  .battery-fill { height:100%; background:#4ade80; border-radius:2px; transition:width .4s, background .4s; }

  /* === ICONS === */
  .icons { position:absolute; top:52px; left:20px; display:flex; flex-direction:column; gap:2px; z-index:100; }
  .icon { width:92px; padding:10px 4px; text-align:center; border-radius:10px;
    cursor:pointer; transition:.15s cubic-bezier(.4,0,.2,1); position:relative; }
  .icon:hover { background:rgba(255,215,0,.12); transform:translateY(-2px); }
  .icon:active { transform:scale(.94); }
  .icon .glyph { font-size:30px; display:block; margin-bottom:4px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); transition:.2s; }
  .icon:hover .glyph { transform:scale(1.1); }
  .icon .label { font-size:11px; color:#aaa; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #widgets { position:absolute; top:56px; right:20px; width:230px; z-index:100;
    display:flex; flex-direction:column; gap:10px; }
  .widget { background:var(--glass); backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:12px; padding:14px; font-size:12px; transition:.2s; }
  .widget:hover { border-color:rgba(255,215,0,.5); }
  .widget h4 { font-size:10px; color:var(--accent); letter-spacing:1.5px;
    margin-bottom:10px; text-transform:uppercase; font-weight:600; }
  .widget canvas { display:block; width:100%; border-radius:6px; }

  /* === WINDOWS === */
  .window { position:absolute; min-width:320px; min-height:180px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow), 0 0 0 1px rgba(255,215,0,.05);
    display:flex; flex-direction:column; overflow:hidden; animation:winIn .25s cubic-bezier(.4,0,.2,1); }
  @keyframes winIn { from{transform:scale(.92) translateY(10px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
  .window.closing { animation:winOut .2s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes winOut { to{transform:scale(.9);opacity:0} }
  .window.maximized { top:36px !important; left:0 !important;
    width:100vw !important; height:calc(100vh - 36px) !important;
    border-radius:0; transition:.2s cubic-bezier(.4,0,.2,1); }
  .win-title { height:38px; background:rgba(255,215,0,.05);
    border-bottom:1px solid var(--border); display:flex; align-items:center;
    padding:0 12px; cursor:grab; gap:6px; transition:.2s; }
  .win-title:active { cursor:grabbing; }
  .win-title .tname { font-size:12px; color:var(--accent); font-weight:600; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .win-btn { width:24px; height:24px; border-radius:6px; border:none; cursor:pointer;
    background:transparent; color:#777; font-size:13px; transition:.15s; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  .win-btn:hover { background:rgba(255,255,255,.1); color:#fff; }
  .win-btn.close:hover { background:#e74c3c; color:#fff; }
  .win-body { flex:1; overflow:auto; padding:14px; font-size:13px; position:relative; }
  .win-resize { position:absolute; right:0; bottom:0; width:16px; height:16px;
    cursor:nwse-resize; background:linear-gradient(135deg,transparent 50%,rgba(255,215,0,.35) 50%);
    border-bottom-right-radius:var(--radius); }

  .term-body { font-family:'Consolas','Courier New',monospace; font-size:13px;
    line-height:1.7; background:#050508; color:#c8c8c8; padding:14px; }
  .term-line { white-space:pre-wrap; word-break:break-word; }
  .term-prompt { color:var(--accent); }
  .term-input-line { display:flex; align-items:center; }
  .term-input-line span { color:var(--accent); white-space:nowrap; }
  .term-input-line input { flex:1; background:transparent; border:none; outline:none;
    color:#fff; font-family:inherit; font-size:inherit; padding-left:6px; }

  .fm-path { font-size:11px; color:#666; margin-bottom:12px; font-family:'Consolas',monospace;
    padding:6px 10px; background:rgba(255,255,255,.03); border-radius:6px; }
  .fm-row { display:flex; align-items:center; gap:12px; padding:9px 12px;
    border-radius:8px; cursor:pointer; font-size:13px; transition:.15s; }
  .fm-row:hover { background:rgba(255,215,0,.08); transform:translateX(2px); }
  .fm-row.selected { background:rgba(255,215,0,.18); }
  .fm-row .fgi { font-size:18px; }
  .fm-row .fname { flex:1; }
  .fm-row .fsize { font-size:10px; color:#555; font-family:'Consolas',monospace; }
  .fm-toolbar { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .fm-toolbar button { padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    background:rgba(255,215,0,.06); color:var(--accent); cursor:pointer;
    font-size:11px; transition:.15s; font-weight:500; }
  .fm-toolbar button:hover { background:rgba(255,215,0,.18); transform:translateY(-1px); }
  .fm-dropzone { border:2px dashed rgba(255,215,0,.25); border-radius:10px; padding:14px;
    text-align:center; color:#666; font-size:11px; margin-bottom:12px; transition:.2s; }
  .fm-dropzone.dragover { border-color:var(--accent); background:rgba(255,215,0,.1);
    color:var(--accent); transform:scale(1.02); }

  .editor-area { width:100%; height:100%; background:#050508; color:#e0e0e0;
    border:none; outline:none; font-family:'Consolas',monospace; font-size:13px;
    padding:14px; resize:none; line-height:1.6; }

  .mode-card { padding:14px; border-radius:10px; margin-bottom:8px; cursor:pointer;
    border:1px solid rgba(255,255,255,.08); transition:.2s; }
  .mode-card:hover { border-color:rgba(255,215,0,.5); transform:translateX(3px); }
  .mode-card.active { border-color:var(--accent);
    background:linear-gradient(90deg,rgba(255,215,0,.12),transparent);
    box-shadow:inset 3px 0 0 var(--accent); }
  .mode-card h4 { font-size:13px; margin-bottom:4px; font-weight:600; }
  .mode-card p { font-size:11px; color:#888; }
  .setting-row { display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13px; }
  .setting-row:last-child { border:none; }
  .toggle { width:42px; height:24px; background:#333; border-radius:12px;
    position:relative; cursor:pointer; transition:.25s cubic-bezier(.4,0,.2,1); }
  .toggle.on { background:var(--accent); box-shadow:0 0 12px rgba(255,215,0,.4); }
  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px;
    background:#fff; border-radius:50%; transition:.25s cubic-bezier(.4,0,.2,1);
    box-shadow:0 2px 4px rgba(0,0,0,.3); }
  .toggle.on::after { left:21px; }

  /* Settings tabs */
  .stabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid rgba(255,255,255,.08);
    padding-bottom:10px; overflow-x:auto; }
  .stab { padding:8px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-size:12px;
    background:transparent; color:#888; border:none; transition:.15s; font-weight:500;
    white-space:nowrap; }
  .stab:hover { background:rgba(255,215,0,.08); color:var(--accent); }
  .stab.active { background:rgba(255,215,0,.15); color:var(--accent);
    box-shadow:inset 0 -2px 0 var(--accent); }
  .stab-content { display:none; }
  .stab-content.active { display:block; }

  /* Updates */
  .update-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
    border-radius:10px; padding:16px; margin-bottom:12px; transition:.2s; }
  .update-card:hover { border-color:rgba(255,215,0,.3); }
  .update-card h4 { color:var(--accent); font-size:13px; margin-bottom:6px; display:flex;
    align-items:center; gap:8px; }
  .update-card p { color:#888; font-size:11px; line-height:1.6; margin-bottom:10px; }
  .update-card .ver { font-family:'Consolas',monospace; font-size:11px; color:#4ade80;
    background:rgba(74,222,128,.1); padding:2px 8px; border-radius:4px; }
  .update-btn { padding:10px 20px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#111; border:none; border-radius:8px; font-weight:700; cursor:pointer;
    font-size:12px; transition:.2s; box-shadow:0 4px 16px rgba(255,215,0,.3); }
  .update-btn:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(255,215,0,.5); }
  .update-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .update-progress { height:8px; background:rgba(255,255,255,.1); border-radius:4px;
    overflow:hidden; margin-top:10px; display:none; }
  .update-progress.show { display:block; }
  .update-progress-fill { height:100%; width:0; background:linear-gradient(90deg,#ffd700,#ff8c00);
    border-radius:4px; transition:width .3s; box-shadow:0 0 10px rgba(255,215,0,.6); }
  .update-log { background:#050508; border:1px solid var(--border); border-radius:8px;
    padding:12px; margin-top:12px; font-family:'Consolas',monospace; font-size:11px;
    color:#4ade80; max-height:180px; overflow-y:auto; line-height:1.6;
    display:none; white-space:pre-wrap; }
  .update-log.show { display:block; }
  .update-log .err { color:#f87171; }
  .update-log .warn { color:#fbbf24; }

  .code-editor { width:100%; height:150px; background:#050508; color:#4ade80;
    border:1px solid var(--border); border-radius:8px; padding:12px;
    font-family:'Consolas',monospace; font-size:12px; resize:vertical; outline:none; line-height:1.6; }
  .code-out { background:#050508; border:1px solid var(--border); border-radius:8px;
    padding:12px; margin-top:10px; font-family:'Consolas',monospace; font-size:12px;
    color:#c8c8c8; min-height:60px; max-height:220px; overflow:auto; white-space:pre-wrap; line-height:1.6; }
  .run-btn { padding:10px 20px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#111; border:none; border-radius:8px; font-weight:700; cursor:pointer;
    font-size:12px; transition:.2s; box-shadow:0 4px 16px rgba(255,215,0,.3); }
  .run-btn:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(255,215,0,.5); }

  .snap-item { display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.06);
    margin-bottom:8px; font-size:12px; transition:.15s; }
  .snap-item:hover { border-color:rgba(255,215,0,.3); background:rgba(255,215,0,.03); }
  .snap-item .snap-name { color:var(--accent); font-family:'Consolas',monospace; font-size:11px; }
  .snap-item button { padding:5px 12px; border-radius:6px; border:none; cursor:pointer;
    background:rgba(255,215,0,.15); color:var(--accent); font-size:11px; transition:.15s; }

  /* === BROWSER === */
  .vb-wrap { display:flex; flex-direction:column; height:100%; margin:-14px; background:#1a1a22; }
  .vb-tabs { display:flex; align-items:flex-end; gap:2px; padding:8px 8px 0 8px;
    background:#0f0f18; overflow-x:auto; scrollbar-width:thin; min-height:40px; }
  .vb-tab { display:flex; align-items:center; gap:6px; padding:8px 14px;
    min-width:140px; max-width:240px; background:rgba(255,255,255,.03);
    border-radius:10px 10px 0 0; cursor:pointer; font-size:12px; color:#888;
    transition:.2s; border:1px solid transparent; border-bottom:none; flex-shrink:0; position:relative; }
  .vb-tab:hover { background:rgba(255,215,0,.08); color:#aaa; }
  .vb-tab.active { background:#1a1a22; color:var(--accent); border-color:var(--border); }
  .vb-tab .tab-fav { font-size:13px; }
  .vb-tab .tab-title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vb-tab .tab-close { width:18px; height:18px; border-radius:50%; border:none;
    cursor:pointer; background:transparent; color:#666; font-size:11px; line-height:1;
    opacity:0; transition:.15s; display:flex; align-items:center; justify-content:center; }
  .vb-tab:hover .tab-close { opacity:1; }
  .vb-tab .tab-close:hover { background:rgba(231,76,60,.8); color:#fff; }
  .vb-tab-new { width:28px; height:28px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.04); color:#888; font-size:16px; margin:0 4px 6px 4px;
    transition:.2s; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .vb-tab-new:hover { background:rgba(255,215,0,.2); color:var(--accent); transform:rotate(90deg); }

  .vb-toolbar { display:flex; align-items:center; gap:4px; padding:6px 10px;
    background:#1a1a22; border-bottom:1px solid var(--border); }
  .vb-nav-btn { width:32px; height:32px; border-radius:8px; border:none; cursor:pointer;
    background:rgba(255,255,255,.04); color:#999; font-size:14px;
    display:flex; align-items:center; justify-content:center; transition:.15s; }
  .vb-nav-btn:hover:not(:disabled) { background:rgba(255,215,0,.15);
    color:var(--accent); transform:scale(1.05); }
  .vb-nav-btn:disabled { opacity:.3; cursor:not-allowed; }
  .vb-address { flex:1; display:flex; align-items:center; gap:8px;
    background:#050508; border:1px solid var(--border); border-radius:10px;
    padding:0 12px; height:34px; transition:.2s; }
  .vb-address:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,215,0,.15); }
  .vb-address .protocol { font-size:13px; flex-shrink:0; }
  .vb-address input { flex:1; background:transparent; border:none; outline:none;
    color:#e0e0e0; font-size:12px; font-family:'Consolas',monospace; }
  .vb-address .vb-lock { font-size:12px; color:#4ade80; }

  .vb-bookmarks-bar { display:flex; gap:2px; padding:4px 10px;
    background:#15151e; border-bottom:1px solid rgba(255,215,0,.08); font-size:11px;
    overflow-x:auto; scrollbar-width:thin; min-height:30px; align-items:center; }
  .vb-bm { padding:5px 12px; border-radius:6px; cursor:pointer; white-space:nowrap;
    color:#888; display:flex; align-items:center; gap:6px; transition:.15s; }
  .vb-bm:hover { background:rgba(255,215,0,.12); color:var(--accent); transform:translateY(-1px); }
  .vb-bm-add { padding:5px 12px; border-radius:6px; cursor:pointer; color:#666;
    background:transparent; border:1px dashed rgba(255,215,0,.25); font-size:11px; transition:.15s; }
  .vb-bm-add:hover { color:var(--accent); border-color:var(--accent); background:rgba(255,215,0,.05); }

  .vb-content { flex:1; position:relative; background:#fff; overflow:hidden; }
  .vb-frame { width:100%; height:100%; border:none; background:#fff; display:block; }

  .vb-startpage { position:absolute; inset:0;
    background:linear-gradient(135deg,#0a0a12 0%,#1a1a2e 60%,#0a0a12 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:60px 20px 40px; overflow-y:auto; color:#e0e0e0; }
  .vb-startpage-logo { font-size:72px; filter:drop-shadow(0 0 30px #ffd700);
    margin-bottom:16px; animation:bootPulse 3s ease-in-out infinite; }
  .vb-startpage h2 { color:var(--accent); letter-spacing:8px; margin-bottom:36px;
    font-size:28px; font-weight:300; }
  .vb-search-box { display:flex; width:100%; max-width:620px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,215,0,.3);
    border-radius:28px; padding:0 24px; height:54px; align-items:center;

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      mode: state.mode, battery: state.battery,
      vdesktops: state.vdesktops, lightTheme: state.lightTheme,
      amoled: state.amoled, notifications: state.notifications,
      currentUser: state.currentUser, snapshots: state.snapshots,
      fs: serializeFS(), wallpaper: state.wallpaper,
      lockPassword: state.lockPassword,
      browserHistory: vbState.history.slice(0, 200),
      browserBookmarks: vbState.bookmarks,
      browserDownloads: vbState.downloads.slice(0, 50)
    }));
    localStorage.setItem(LS_USERS, JSON.stringify(
      Object.keys(state.users).reduce((acc, u) => {
        acc[u] = {
          name: state.users[u].name,
          avatar: state.users[u].avatar,
          notes: state.users[u].notes || [],
          password: state.users[u].password || ''
        };
        return acc;
      }, {})
    ));
  } catch(e) { console.warn('save failed', e); }
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      Object.assign(state, {
        mode: d.mode || 'balanced',
        battery: d.battery ?? 87,
        vdesktops: d.vdesktops || 4,
        lightTheme: !!d.lightTheme,
        amoled: !!d.amoled,
        notifications: d.notifications !== false,
        currentUser: d.currentUser || 'guest',
        snapshots: d.snapshots || [],
        wallpaper: d.wallpaper || 0,
        lockPassword: d.lockPassword || ''
      });
      if (d.fs) deserializeFS(d.fs);
      if (d.browserHistory) vbState.history = d.browserHistory;
      if (d.browserBookmarks) vbState.bookmarks = d.browserBookmarks;
      if (d.browserDownloads) vbState.downloads = d.browserDownloads;
      document.body.classList.toggle('light', state.lightTheme);
      document.body.classList.toggle('amoled', state.amoled);
    }
    const u = localStorage.getItem(LS_USERS);
    if (u) {
      const parsed = JSON.parse(u);
      Object.keys(parsed).forEach(k => {
        if (!state.users[k]) state.users[k] = {
          name: parsed[k].name, avatar: parsed[k].avatar || '👤',
          notes: parsed[k].notes || [], password: parsed[k].password || ''
        };
        else {
          state.users[k].notes = parsed[k].notes || [];
          state.users[k].password = parsed[k].password || '';
        }
      });
    }
    return !!raw;
  } catch(e) { return false; }
}

function serializeFS() {
  const out = {};
  for (const k in fs) {
    const o = fs[k];
    out[k] = {
      icon:o.icon, dir:o.dir,
      content: o.dir ? serializeFSFrom(o.content) : o.content,
      binary:o.binary, size:o.size, mime:o.mime,
      embeddedCover: o.embeddedCover
    };
  }
  return out;
}
function serializeFSFrom(obj) {
  const out = {};
  for (const k in obj) {
    const o = obj[k];
    out[k] = {
      icon:o.icon, dir:o.dir,
      content: o.dir ? serializeFSFrom(o.content) : o.content,
      binary:o.binary, size:o.size, mime:o.mime,
      embeddedCover: o.embeddedCover
    };
  }
  return out;
}
function deserializeFS(data) {
  Object.keys(fs).forEach(k => delete fs[k]);
  for (const k in data) fs[k] = data[k];
}

/* ============ CLOCK / STATS ============ */
function updateClock() {
  const d = new Date();
  const time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = time;
  const lc = document.getElementById('lockClock');
  const ld = document.getElementById('lockDate');
  if (lc) lc.textContent = time;
  if (ld) {
    const opts = { weekday:'long', day:'numeric', month:'long' };
    ld.textContent = d.toLocaleDateString('ru-RU', opts);
  }
}
function tickStats() {
  const drain = { turbo:0.3, balanced:0.1, eco:0.04, survival:0.01 }[state.mode];
  state.battery = Math.max(0, state.battery - drain);
  state.cpu = Math.max(3, Math.min(95, state.cpu + (Math.random()-0.5)*8));
  state.mem = Math.max(1.2, Math.min(7.5, state.mem + (Math.random()-0.5)*0.2));
  if (state.battery < 20 && !state._warned) {
    state._warned = true;
    notify('🔋 Батарея', 'Заряд ниже 20%. Рекомендую eco.');
  }
  if (state.battery < 5) state.mode = 'survival';
  renderStats();
}
function renderStats() {
  document.getElementById('batTxt').textContent = Math.round(state.battery)+'%';
  const fill = document.getElementById('batFill');
  fill.style.width = state.battery+'%';
  fill.style.background = state.battery < 20 ? '#f87171' : '#4ade80';
  document.getElementById('cpuTxt').textContent = Math.round(state.cpu)+'%';
  document.getElementById('memTxt').textContent = state.mem.toFixed(1)+' GB';
  document.getElementById('modePill').textContent = state.mode;
  let total = 0;
  for (const k in fs) total += (fs[k].content ? String(fs[k].content).length : 0) + (fs[k].size||0);
  document.getElementById('diskTxt').textContent = (total/1024).toFixed(1) + ' KB';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2800);
}
function notify(title, msg) {
  if (!state.notifications) return;
  const n = document.createElement('div');
  n.className = 'notif';
  n.innerHTML = `<h5>${title}</h5>${msg}`;
  document.getElementById('notifs').appendChild(n);
  setTimeout(() => { n.style.opacity = '0'; setTimeout(()=>n.remove(), 300); }, 4500);
}
function updateUserPill() {
  const u = state.users[state.currentUser];
  document.getElementById('userPill').textContent = (u?u.avatar:'👤') + ' ' + state.currentUser;
}

/* ============ VDESKTOPS ============ */
function initVDesktops() {
  const dots = document.getElementById('vdots');
  dots.innerHTML = '';
  for (let i = 0; i < state.vdesktops; i++) {
    const d = document.createElement('div');
    d.className = 'vdot' + (i===state.currentVD ? ' active' : '');
    d.onclick = () => switchVD(i);
    dots.appendChild(d);
  }
}
function switchVD(n) {
  state.currentVD = n;
  document.querySelectorAll('.vdot').forEach((d,i)=>d.classList.toggle('active', i===n));
  Object.entries(state.windows).forEach(([id, w]) => {
    w.style.display = (state.vdWindows[id] === n) ? '' : 'none';
  });
}

    setTimeout(() => {
      document.getElementById('lockHint').style.color = '#555';

}

    if (win.classList.contains('maximized')) return;
    dragging = true;
    dx = e.clientX - win.offsetLeft;
    dy = e.clientY - win.offsetTop;
    e.preventDefault();
  };
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    win.style.left = Math.max(0, e.clientX - dx)+'px';
    win.style.top  = Math.max(36, e.clientY - dy)+'px';
  });
  document.addEventListener('mouseup', () => dragging = false);

  const rz = win.querySelector('.win-resize');
  let rx=0, ry=0, rw=0, rh=0, resizing=false;
  rz.onmousedown = (e) => {
    e.stopPropagation(); resizing = true;
    rx = e.clientX; ry = e.clientY;
    rw = win.offsetWidth; rh = win.offsetHeight;
    e.preventDefault();
  };
  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    win.style.width = Math.max(320, rw + (e.clientX-rx))+'px';
    win.style.height = Math.max(180, rh + (e.clientY-ry))+'px';
  });
  document.addEventListener('mouseup', () => resizing = false);

  title.oncontextmenu = (e) => {
    e.preventDefault();
    showContextMenu(e, [
      { label:'Свернуть', icon:'—', action:()=>{ win.style.display='none'; } },
      { label:'Развернуть', icon:'□', action:()=>{ win.classList.toggle('maximized'); } },
      { sep:true },
      { label:'На другой стол', icon:'🖥️', action:()=>{
        const next = (state.vdWindows[id]+1) % state.vdesktops;
        state.vdWindows[id] = next;
        toast('Окно на столе ' + (next+1));
      }},
      { sep:true },
      { label:'Закрыть', icon:'✕', action: closeWin }
    ]);
  };

  document.getElementById('windows').appendChild(win);
  state.windows[id] = win;
  state.vdWindows[id] = state.currentVD;

  try {
    const inits = {
      terminal: initTerminal, files: initFiles, editor: initEditor,
      settings: initSettings, wasm: initWasm, sched: initSched,
      snap: initSnap, browser: initBrowser, music: initMusic,
      video: initVideo, imgview: initImgView, notes: initNotes,
      snake: initSnake, g2048: initG2048, users: initUsers
    };
    if (inits[id]) inits[id](win);
  } catch(e) { console.error('Window init failed:', id, e); }
  return win;
}
function bringFront(id) {
  const w = state.windows[id];
  if (w) w.style.zIndex = ++state.z;
}

/* ============ MUSIC COVERS ============ */
function saveMusicCovers() {
  try { localStorage.setItem(LS_COVERS, JSON.stringify(musicCovers)); }
  catch(e) {}
}
function pickCoverEmoji(name) {
  const emojis = ['🎵','🎶','🎧','🎤','🎼','🥁','🎸','🎹','🎺','🎻'];
  let h = 0; for (const c of name) h += c.charCodeAt(0);
  return emojis[h % emojis.length];
}
function getCoverContent(name) {
  const f = fs[name];
  if (musicCovers[name]) {
    const c = musicCovers[name];
    if (c.type === 'emoji') return { type:'emoji', value: c.value };
    if (c.type === 'url' || c.type === 'data') return { type:'img', value: c.value };
  }
  if (f && f.embeddedCover) return { type:'img', value: f.embeddedCover };
  return { type:'emoji', value: pickCoverEmoji(name) };
}
function applyCoverToEl(el, name) {
  if (!el) return;
  const c = getCoverContent(name);
  if (c.type === 'emoji') {
    el.innerHTML = '';
    el.style.backgroundImage = '';
    el.style.background = 'linear-gradient(135deg, #ffd700, #ff8c00, #e74c3c)';
    el.textContent = c.value;
    el.style.fontSize = '56px';
  } else {
    el.textContent = '';
    el.style.background = '#0a0a12';
    el.style.backgroundImage = `url('${c.value}')`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.style.fontSize = '0';
  }
}
function extractCoverFromFile(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const buf = new Uint8Array(e.target.result);
        if (buf[0] !== 0x49 || buf[1] !== 0x44 || buf[2] !== 0x33) return resolve(null);
        const size = ((buf[6] & 0x7f) << 21) | ((buf[7] & 0x7f) << 14) |
                     ((buf[8] & 0x7f) << 7)  |  (buf[9] & 0x7f);
        let offset = 10;
        const end = 10 + size;
        while (offset < end - 10 && offset < buf.length - 10) {
          const frameId = String.fromCharCode(buf[offset], buf[offset+1], buf[offset+2], buf[offset+3]);
          const frameSize = (buf[offset+4] << 24) | (buf[offset+5] << 16) |
                            (buf[offset+6] << 8)  |  buf[offset+7];
          if (frameSize <= 0 || frameSize > buf.length - offset) break;
          if (frameId === 'APIC') {
            let p = offset + 10;
            const encByte = buf[p++];
            let mimeEnd = p;
            while (mimeEnd < offset + 10 + frameSize && buf[mimeEnd] !== 0) mimeEnd++;
            const mime = String.fromCharCode(...buf.slice(p, mimeEnd));
            p = mimeEnd + 1;
            p++;
            if (encByte === 1 || encByte === 2) {
              while (p < buf.length - 1 && !(buf[p] === 0 && buf[p+1] === 0)) p += 2;
              p += 2;
            } else {
              while (p < buf.length && buf[p] !== 0) p++;
              p++;
            }
            const imgData = buf.slice(p, offset + 10 + frameSize);
            const blob = new Blob([imgData], { type: mime || 'image/jpeg' });
            return resolve(URL.createObjectURL(blob));
          }
          offset += 10 + frameSize;
        }
        resolve(null);
      } catch(err) { resolve(null); }
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, Math.min(file.size, 2 * 1024 * 1024)));
  });
}
function setCustomCover(name) {
  const f = fs[name];
  if (!f) return;
  const current = musicCovers[name];
  let hint = 'Что поставить?\n\n1 — URL картинки\n2 — Эмодзи\n3 — Загрузить картинку\n4 — Убрать';
  if (current) hint += `\n\nСейчас: ${current.type === 'emoji' ? current.value : 'картинка'}`;
  const choice = prompt(hint, '1');
  if (choice === null) return;
  if (choice === '1') {
    const url = prompt('URL картинки:');
    if (!url) return;
    musicCovers[name] = { type:'url', value: url };
    saveMusicCovers(); refreshMusicPlaylist();
    if (musicState.playlist[musicState.current] === name) applyCoverToEl(document.getElementById('musicCover'), name);
    toast('✅ Установлено');
  } else if (choice === '2') {
    const emoji = prompt('Эмодзи:', '🎸');
    if (!emoji) return;
    musicCovers[name] = { type:'emoji', value: emoji.slice(0,4) };
    saveMusicCovers(); refreshMusicPlaylist();
    if (musicState.playlist[musicState.current] === name) applyCoverToEl(document.getElementById('musicCover'), name);
    toast('✅ Установлено');
  } else if (choice === '3') {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const file = inp.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        musicCovers[name] = { type:'data', value: r.result };
        saveMusicCovers(); refreshMusicPlaylist();
        if (musicState.playlist[musicState.current] === name) applyCoverToEl(document.getElementById('musicCover'), name);
        toast('✅ Загружено');
      };
      r.readAsDataURL(file);
    };
    inp.click();
  } else if (choice === '4') {
    delete musicCovers[name];
    saveMusicCovers(); refreshMusicPlaylist();
    if (musicState.playlist[musicState.current] === name) applyCoverToEl(document.getElementById('musicCover'), name);
    toast('Сброшено');
  }
}
function musicTrackContextMenu(e, name) {
  e.preventDefault(); e.stopPropagation();
  showContextMenu(e, [

}

/* ============ FILE UPLOAD ============ */
function pickFileForUpload() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.onchange = async () => {
    if (inp.files.length) await handleUploadedFiles(inp.files);
  };
  inp.click();
}
async function handleUploadedFiles(fileList) {
  const files = Array.from(fileList);
  let count = 0;
  for (const file of files) {
    try { await uploadOneFile(file); count++; }
    catch(e) { notify('❌', 'Не удалось: ' + file.name); }
  }
  if (count > 0) {
    notify('📤 Загрузка', 'Добавлено: ' + count);
    if (state.windows.files) renderFilesList(state.windows.files, '/');
    if (state.windows.music) refreshMusicPlaylist();
    if (state.windows.imgview) refreshImgList();
    if (state.windows.video) refreshVideoList();
    renderStats(); saveState();
  }
}
async function uploadOneFile(file) {
  let embeddedCover = null;
  try {
    if (file.type && file.type.startsWith('audio/')) {
      embeddedCover = await extractCoverFromFile(file);
    }
  } catch(e) {}
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      let icon = '📄';
      const mime = file.type || '';
      if (mime.startsWith('image/')) icon = '🖼️';
      else if (mime.startsWith('audio/')) icon = '🎵';
      else if (mime.startsWith('video/')) icon = '🎬';
      else if (mime.includes('pdf')) icon = '📕';
      else if (mime.includes('zip')) icon = '🗜️';
      const isText = mime.startsWith('text/') ||
        /\.(txt|md|js|css|html|json|xml|csv|toml|yml|yaml|log|ini|sh|py|rs|c|cpp|h|go|java|rb|php)$/i.test(file.name);
      let content, binary;
      if (isText) content = reader.result;
      else {
        binary = reader.result;
        content = '[binary: ' + file.name + ', ' + (file.size/1024).toFixed(1) + ' KB]';
      }
      let name = file.name; let i = 1;
      while (fs[name]) {
        const dot = file.name.lastIndexOf('.');
        name = dot > 0
          ? file.name.slice(0,dot) + '_' + i + file.name.slice(dot)
          : file.name + '_' + i;
        i++;
      }
      fs[name] = {
        icon, content, binary, size:file.size,
        mime:file.type, uploadedAt:Date.now(), embeddedCover
      };
      resolve();
    };
    reader.onerror = () => reject(reader.error);
    const isTextGuess = file.type.startsWith('text/') ||
      /\.(txt|md|js|css|html|json|xml|csv|toml|yml|yaml|log|ini|sh|py|rs|c|cpp|h|go|java|rb|php)$/i.test(file.name);
    if (isTextGuess) reader.readAsText(file);
    else reader.readAsDataURL(file);
  });
}

function exportFS() {
  const data = {
    voltos: '6.3', exported: new Date().toISOString(),
    fs: serializeFS(), users: state.users, snapshots: state.snapshots,
    musicCovers
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'voltos-backup-' + Date.now() + '.voltos.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('📦 Экспортировано');
}
function importFS() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,.voltos';
  inp.onchange = () => {
    const file = inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d.fs) throw new Error('Нет FS');
        if (!confirm('Импортировать?')) return;
        deserializeFS(d.fs);
        if (d.users) state.users = d.users;
        if (d.snapshots) state.snapshots = d.snapshots;
        if (d.musicCovers) { musicCovers = d.musicCovers; saveMusicCovers(); }
        saveState(); fmRefresh();
        if (state.windows.music) refreshMusicPlaylist();
        toast('✓ Импортировано');
      } catch(e) { toast('Ошибка: ' + e.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function termBody() {
  return `
    <div class="term-lines" id="termLines">
      <div class="term-line">⚡ VoltOS 6.3 — <span style="color:#ffd700">help</span></div>
    </div>
    <div class="term-input-line">
      <span>volt@os:~$</span>
      <input id="termIn" autocomplete="off" spellcheck="false">
    </div>
  `;
}
function initTerminal(win) {
  const inp = win.querySelector('#termIn');
  const out = win.querySelector('#termLines');
  inp.focus();
  win.onmousedown = (e) => {
    bringFront('terminal');
    if (e.target !== inp) setTimeout(()=>inp.focus(), 0);
  };
  inp.onkeydown = (e) => {
    if (e.key === 'Enter') {
      const cmd = inp.value.trim(); inp.value = '';
      addLine(out, '<span class="term-prompt">volt@os:~$</span> ' + escapeHtml(cmd));
      if (cmd) { state.history.push(cmd); runCmd(out, cmd); }
    } else if (e.key === 'ArrowUp') {
      if (state.history.length) inp.value = state.history[state.history.length-1];
    }
  };
}
function addLine(out, html) {
  const d = document.createElement('div');
  d.className = 'term-line'; d.innerHTML = html;
  out.appendChild(d);
  out.parentElement.scrollTop = out.parentElement.scrollHeight;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function runCmd(out, cmdline) {
  try {
    const [cmdPart, ...pipes] = cmdline.split('|').map(s=>s.trim());
    if (cmdPart === 'clear') { out.innerHTML = ''; return; }
    let output = execSimple(cmdPart, null);
    for (const p of pipes) output = execSimple(p, output);
    if (output) addLine(out, '<pre style="white-space:pre-wrap;margin:0">' + escapeHtml(output) + '</pre>');
  } catch(err) {
    addLine(out, '<span style="color:#f87171">' + escapeHtml(err.message || err) + '</span>');
  }
}
function execSimple(cmdStr, input) {
  const tokens = tokenize(cmdStr);
  if (!tokens.length) return input || '';
  const [c, ...args] = tokens;
  switch (c) {
    case 'help': return `Команды: help, ls, pwd, whoami, cat, write, rm, touch, echo, grep, wc, sort, head, tail, date, hostname, uname, uptime, upload, export, import, browse URL, snap create|list, vd N, theme, lock, user, notify, save, reset, neofetch, volt, update, glitch`;
    case 'clear': throw {clear:true};
    case 'ls': return Object.keys(fs).map(f => fs[f].icon+' '+f).join('\n');
    case 'pwd': return '/home/' + state.currentUser;
    case 'whoami': return state.currentUser;
    case 'cat': return fs[args[0]] ? String(fs[args[0]].content || '').slice(0,5000) : 'no such file';
    case 'rm': if (fs[args[0]]) { delete fs[args[0]]; saveState(); return 'removed'; } throw new Error('no file');
    case 'touch': fs[args[0]] = { icon:'📄', content:'' }; saveState(); return '';
    case 'echo': return args.join(' ').replace(/^["']|["']$/g,'');
    case 'grep': return (input||'').split('\n').filter(l => l.includes(args[0])).join('\n');
    case 'wc': return `${(input||'').split('\n').filter(x=>x).length} ${(input||'').split(/\s+/).filter(x=>x).length} ${(input||'').length}`;
    case 'sort': return (input||'').split('\n').sort().join('\n');
    case 'date': return new Date().toLocaleString();
    case 'hostname': return 'voltos';
    case 'uname': return 'VoltOS 6.3';
    case 'uptime': return Math.floor(performance.now()/1000) + 's';
    case 'upload': pickFileForUpload(); return '→';
    case 'export': exportFS(); return '→';
    case 'import': importFS(); return '→';
    case 'update': openSettingsTab('updates'); return '→ открываю обновления';
    case 'glitch': if (confirm('Активировать глитч?')) { activateGlitchMode(); } return '';
    case 'browse': openWindow('browser'); setTimeout(()=>vbNavigate(args[0]), 100); return '→';
    case 'lock': showLockScreen(); return '';
    case 'save': saveState(); return '✓';
    case 'reset': if (confirm('Сброс?')) { localStorage.clear(); location.reload(); } return '';
    case 'user': return Object.keys(state.users).join('\n');
    case 'neofetch': return `       ⚡
      /\\
     /  \\      VoltOS 6.3
    / /\\ \\     kernel: VoltCore 6.3
   / ____ \\    shell:  VoltShell 6.3
  /_/    \\_\\   user:   ${state.currentUser}
               mode:   ${state.mode}
               glitch: ${IS_GLITCHED ? 'YES ⚠' : 'no'}`;
    case 'volt':
      if (args[0]==='status') return `🔋 ${Math.round(state.battery)}%\n⚙ ${Math.round(state.cpu)}%\n🧠 ${state.mem.toFixed(1)} GB\n⚡ ${state.mode}`;
      if (args[0]==='mode') { setMode(args[1]); return '✓'; }
      throw new Error('volt status|mode');
    case 'snap':
      if (args[0]==='create') { const s=createSnapshot(); return '✓ '+s.name; }
      if (args[0]==='list') return state.snapshots.map(s=>s.name).join('\n') || 'none';
      throw new Error('snap create|list');
    case 'vd': switchVD(Math.max(0,Math.min(state.vdesktops-1, +args[0]-1))); return '→';
    case 'theme':
      if (args[0]==='light') setTheme(true);
      else if (args[0]==='dark') setTheme(false);
      else if (args[0]==='amoled') setAMOLED(true);
      return '';
    case 'notify': notify('VoltOS', args.join(' ')); return '';
    default: throw new Error('not found: '+c);
  }
}
function tokenize(s) {
  const tokens = [];
  const re = /"([^"]*)"|'([^']*)'|(\S+)/g;
  let m;
  while ((m = re.exec(s))) tokens.push(m[1] ?? m[2] ?? m[3]);
  return tokens;
}

  fs[name] = { icon:'📁', dir:true, content:{} };

}
function createFileDialog() { fmNewFile(); }
function openFile(name) {
  const f = fs[name];
  if (!f || f.dir) return;
  if (f.binary) {
    if (f.mime?.startsWith('image/')) { openWindow('imgview'); setTimeout(()=>showImage(name), 50); return; }
    if (f.mime?.startsWith('audio/')) { openWindow('music'); setTimeout(()=>playMusic(name), 60); return; }
    if (f.mime?.startsWith('video/')) { openWindow('video'); setTimeout(()=>playVideo(name), 60); return; }
    downloadFile(name); return;
  }
  if (name.endsWith('.html')) { openInBrowser(name); return; }
  openWindow('editor', { force:true });
  setTimeout(() => {
    const w = state.windows.editor;
    if (w) {
      const ta = w.querySelector('.editor-area');
      if (ta) { ta.value = f.content || ''; ta.dataset.file = name; }
      w.querySelector('.tname').textContent = '📝 ' + name;
    }
  }, 20);
}
function openInBrowser(name) {
  const f = fs[name]; if (!f) return;
  openWindow('browser');
  setTimeout(() => vbNavigate('voltos://' + name), 80);
}
function openInMusic(name) {
  const f = fs[name];
  if (!f || !f.binary) { toast('Не аудио'); return; }
  openWindow('music');
  setTimeout(()=>playMusic(name), 60);
}
function downloadFile(name) {
  const f = fs[name]; if (!f) return;
  let blob;
  if (f.binary) {
    const arr = f.binary.split(',');
    const bstr = atob(arr[1]);
    const u8 = new Uint8Array(bstr.length);
    for (let i=0;i<bstr.length;i++) u8[i] = bstr.charCodeAt(i);
    blob = new Blob([u8], {type:f.mime || 'application/octet-stream'});
  } else {
    blob = new Blob([f.content || ''], {type:'text/plain'});
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Скачивание: ' + name);
}

function vbCreateTab(url) {

function vbCloseTab(idx) {

  else if (vbState.activeTab > idx) vbState.activeTab--;
  vbRenderTabs(); vbRestoreTab();
}
function vbSwitchTab(idx) {

function vbRestoreTab() {

function vbHandleAddressInput(v) {
  if (!v) return;
  if (v.startsWith('volt://') || v.startsWith('voltos://')) { vbNavigate(v); return; }
  if (/^https?:\/\//i.test(v)) { vbNavigate(v); return; }
  if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v)) { vbNavigate('https://' + v); return; }
  vbNavigate('https://duckduckgo.com/?q=' + encodeURIComponent(v));
}
function vbNavigate(url) {
  const tab = vbGetActiveTab();
  if (!tab) { vbCreateTab(url); return; }
  tab.history = tab.history.slice(0, tab.histIndex + 1);
  tab.history.push(url);
  tab.histIndex = tab.history.length - 1;
  tab.url = url;
  vbLoadTab(tab);
  if (!url.startsWith('volt://') && !url.startsWith('voltos://')) {
    vbState.history.unshift({ url, title: tab.title, time: Date.now() });
    if (vbState.history.length > 200) vbState.history.pop();
    saveState();
  }
}
function vbLoadTab(tab) {
  const frame = document.getElementById('vbFrame');
  const content = document.getElementById('vbContent');
  const addr = document.getElementById('vbAddr');
  if (!frame || !content) return;
  if (addr) addr.value = tab.url;
  content.querySelectorAll('.vb-startpage, .vb-blocked').forEach(el => el.remove());
  if (tab.url === 'volt://start' || tab.url === 'volt://home') {
    tab.title = 'Новая вкладка'; tab.favicon = '⚡';
    frame.srcdoc = ''; frame.style.display = 'none';
    renderStartPage(content, tab);
    vbRenderTabs(); vbUpdateNavButtons(); return;
  }
  if (tab.url.startsWith('voltos://')) {
    const fname = decodeURIComponent(tab.url.slice(9));
    const f = fs[fname];
    frame.style.display = 'block';
    if (!f) { vbShowBlocked(content, tab, 'Файл не найден', fname, null); return; }
    if (f.binary && f.mime?.startsWith('image/')) {
      frame.srcdoc = `<html><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100vh"><img src="${f.binary}" style="max-width:100%;max-height:100%"></body></html>`;
    } else {
      frame.srcdoc = f.content || '';
    }
    tab.title = fname;
    vbRenderTabs(); vbUpdateNavButtons(); return;
  }
  frame.style.display = 'block';
  frame.removeAttribute('srcdoc');
  frame.src = tab.url;
  tab.title = tab.url.replace(/^https?:\/\//,'').split('/')[0];
  vbRenderTabs();
  let loaded = false;
  const t = setTimeout(() => {
    if (loaded) return;
    if (content.querySelector('.vb-blocked')) return;
    vbShowBlocked(content, tab, 'Сайт блокирует встраивание',
      `Сайт <b>${escapeHtml(tab.url)}</b> запретил показ в iframe.`, tab.url);
  }, 2000);
  frame.onload = () => {
    loaded = true; clearTimeout(t);
    try {
      tab.title = frame.contentDocument?.title || tab.url.replace(/^https?:\/\//,'').split('/')[0];
      vbRenderTabs();
    } catch(e) {}
    vbUpdateNavButtons();
  };
  vbUpdateNavButtons();
}

function initMusic(win) {

      const p = document.getElementById('musicPlay'); if (p) p.textContent = '⏸';
      document.getElementById('musicCover')?.classList.add('playing');
    });

    win.querySelector('#musicShuffle').classList.toggle('active', musicState.shuffle);

    musicState.repeat = !musicState.repeat;
    win.querySelector('#musicRepeat').classList.toggle('active', musicState.repeat);
  };

  const body = document.getElementById('musicPlaylistBody');

  const audioFiles = Object.keys(fs).filter(k =>

  if (idx >= 0) playMusicByIndex(idx);
}
function playMusicByIndex(i) {
  if (i < 0 || i >= musicState.playlist.length) return;
  const name = musicState.playlist[i];
  const f = fs[name];
  if (!f || !f.binary) return;
  musicState.current = i;
  musicAudio.src = f.binary;
  musicAudio.play().catch(err => toast('Ошибка: ' + err.message));
  document.getElementById('musicTitle').textContent = name.replace(/\.[^.]+$/, '');
  applyCoverToEl(document.getElementById('musicCover'), name);
  document.querySelectorAll('.music-track').forEach((t,idx)=>t.classList.toggle('active', idx===i));
}
function toggleMusicPlay() {
  if (musicState.current === -1 && musicState.playlist.length > 0) { playMusicByIndex(0); return; }
  if (!musicAudio) return;
  if (musicAudio.paused) musicAudio.play().catch(()=>{});
  else musicAudio.pause();
}
function nextMusic(dir) {
  if (!musicState.playlist.length) return;
  let next;
  if (musicState.shuffle && musicState.playlist.length > 1) {
    do { next = Math.floor(Math.random()*musicState.playlist.length); }
    while (next === musicState.current);
  } else {
    next = (musicState.current + dir + musicState.playlist.length) % musicState.playlist.length;
  }
  playMusicByIndex(next);
}
function onMusicEnded() {
  if (musicState.repeat) { musicAudio.currentTime = 0; musicAudio.play().catch(()=>{}); }
  else nextMusic(1);
}
function updateMusicProgress() {
  const cur = document.getElementById('musicCur');
  const dur = document.getElementById('musicDur');
  const fill = document.getElementById('musicProgressFill');
  if (!cur || !musicAudio) return;
  const fmt = (s) => isNaN(s) ? '0:00' : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  cur.textContent = fmt(musicAudio.currentTime);
  dur.textContent = fmt(musicAudio.duration);
  if (musicAudio.duration) fill.style.width = (musicAudio.currentTime/musicAudio.duration*100)+'%';
}
function startMusicViz() {
  const viz = document.getElementById('musicViz');
  const eq = document.getElementById('musicEq');
  if (!viz) return;
  const ctx = viz.getContext('2d');
  const W = viz.width, H = viz.height;
  const eqBars = eq ? Array.from(eq.children) : [];
  if (musicAudio && !musicAnalyser) {
    try {
      musicCtx = musicCtx || new (window.AudioContext || window.webkitAudioContext)();
      musicSource = musicCtx.createMediaElementSource(musicAudio);
      musicAnalyser = musicCtx.createAnalyser();
      musicAnalyser.fftSize = 128;
      musicSource.connect(musicAnalyser);
      musicAnalyser.connect(musicCtx.destination);
    } catch(e) {}
  }
  const dataArray = musicAnalyser ? new Uint8Array(musicAnalyser.frequencyBinCount) : null;
  const timer = setInterval(() => {
    if (!document.body.contains(viz)) { clearInterval(timer); return; }
    ctx.clearRect(0,0,W,H);
    if (musicAnalyser && musicAudio && !musicAudio.paused) {
      musicAnalyser.getByteFrequencyData(dataArray);
      const bw = W / dataArray.length;
      for (let i = 0; i < dataArray.length; i++) {
        const h = (dataArray[i]/255) * H;
        const grad = ctx.createLinearGradient(0, H-h, 0, H);
        grad.addColorStop(0, '#ffd700'); grad.addColorStop(1, '#ff8c00');
        ctx.fillStyle = grad;
        ctx.fillRect(i*bw, H-h, bw-1, h);
      }
    } else {
      const t = performance.now()/400;
      for (let i = 0; i < 30; i++) {
        const h = (Math.sin(t + i*0.4)*0.5 + 0.5) * H * 0.5 + 5;
        ctx.fillStyle = 'rgba(255,215,0,.25)';
        ctx.fillRect(i*(W/30), H-h, W/30-1, h);
      }
    }
  }, 50);
}

async function encryptText(text, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits','deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' },
    keyMat, { name:'AES-GCM', length:256 }, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(text));
  const combined = new Uint8Array(16 + 12 + ct.byteLength);
  combined.set(salt, 0); combined.set(iv, 16); combined.set(new Uint8Array(ct), 28);
  return btoa(String.fromCharCode(...combined));
}
async function decryptText(b64, password) {
  const data = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = data.slice(0,16), iv = data.slice(16,28), ct = data.slice(28);
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits','deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' },
    keyMat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct));
}

function snakeBody() {
  return `
    <div class="game-wrap">
      <div class="game-info">Счёт: <b id="snakeScore">0</b> • Рекорд: <b id="snakeBest">0</b></div>

    </div>
  `;
}
function initSnake(win) {
  const cv = win.querySelector('#snakeCanvas');
  const ctx = cv.getContext('2d');
  const scoreEl = win.querySelector('#snakeScore');
  const bestEl = win.querySelector('#snakeBest');
  const cell = 20, W = cv.width/cell, H = cv.height/cell;
  let snake, dir, food, score, alive, timer;
  let best = +localStorage.getItem('snake_best') || 0;
  bestEl.textContent = best;
  function reset() {
    snake = [{x:5,y:5}]; dir = {x:1,y:0}; score = 0; alive = true;
    placeFood(); scoreEl.textContent = 0;
  }
  function placeFood() {
    do { food = {x: Math.floor(Math.random()*W), y: Math.floor(Math.random()*H)}; }
    while (snake.some(s=>s.x===food.x && s.y===food.y));
  }
  function tick() {
    if (!alive) return;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x<0||head.x>=W||head.y<0||head.y>=H||snake.some(s=>s.x===head.x&&s.y===head.y)) {
      alive = false;
      if (score > best) { best = score; localStorage.setItem('snake_best', best); bestEl.textContent = best; }
      draw(); return;
    }
    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) { score++; scoreEl.textContent = score; placeFood(); }
    else snake.pop();
    draw();
  }
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#0a0a12'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#ff4757'; ctx.beginPath();
    ctx.arc(food.x*cell+cell/2, food.y*cell+cell/2, cell/2-2, 0, Math.PI*2); ctx.fill();
    snake.forEach((s,i) => {
      ctx.fillStyle = i===0 ? '#ffd700' : '#ffb700';
      ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
    });
    if (!alive) {
      ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle = '#ffd700'; ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', cv.width/2, cv.height/2 - 10);
      ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
      ctx.fillText('Счёт: ' + score, cv.width/2, cv.height/2 + 20);
      ctx.fillText('Пробел — заново', cv.width/2, cv.height/2 + 44);
    }
  }
  function handleKey(e) {
    if (!document.body.contains(cv)) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === ' ' && !alive) { reset(); return; }
    if (k === 'arrowup' || k === 'w') { if (dir.y === 0) dir = {x:0,y:-1}; }
    if (k === 'arrowdown' || k === 's') { if (dir.y === 0) dir = {x:0,y:1}; }
    if (k === 'arrowleft' || k === 'a') { if (dir.x === 0) dir = {x:-1,y:0}; }
    if (k === 'arrowright' || k === 'd') { if (dir.x === 0) dir = {x:1,y:0}; }
  }
  document.addEventListener('keydown', handleKey);
  const obs = setInterval(() => {
    if (!document.body.contains(cv)) { clearInterval(timer); clearInterval(obs); document.removeEventListener('keydown', handleKey); }
  }, 500);
  reset(); draw();
  timer = setInterval(tick, 130);
}

function g2048Body() {
  return `
    <div class="game-wrap">
      <div class="game-info">Счёт: <b id="g2048Score">0</b> • Рекорд: <b id="g2048Best">0</b></div>
      <div class="g2048" id="g2048Board"></div>
    </div>
  `;
}
function initG2048(win) {
  const board = win.querySelector('#g2048Board');
  const scoreEl = win.querySelector('#g2048Score');
  const bestEl = win.querySelector('#g2048Best');
  let grid, score, best = +localStorage.getItem('g2048_best') || 0;
  bestEl.textContent = best;
  function reset() {
    grid = Array(4).fill(0).map(()=>Array(4).fill(0));
    score = 0; addTile(); addTile(); render();
  }
  function addTile() {
    const empty = [];
    for (let y=0;y<4;y++) for (let x=0;x<4;x++) if (grid[y][x]===0) empty.push([y,x]);
    if (!empty.length) return;
    const [y,x] = empty[Math.floor(Math.random()*empty.length)];
    grid[y][x] = Math.random() < 0.9 ? 2 : 4;
  }
  function render() {
    board.innerHTML = '';
    for (let y=0;y<4;y++) for (let x=0;x<4;x++) {
      const v = grid[y][x];
      const d = document.createElement('div');
      d.className = 'cell' + (v?' v'+v:'');
      d.textContent = v || '';
      board.appendChild(d);
    }
    scoreEl.textContent = score;
    if (score > best) { best = score; localStorage.setItem('g2048_best', best); bestEl.textContent = best; }
  }
  function slide(row) {
    let arr = row.filter(v=>v);
    for (let i=0;i<arr.length-1;i++) {
      if (arr[i]===arr[i+1]) { arr[i]*=2; score+=arr[i]; arr[i+1]=0; }
    }
    arr = arr.filter(v=>v);
    while (arr.length<4) arr.push(0);
    return arr;
  }
  function move(dir) {
    const before = JSON.stringify(grid);
    if (dir === 'left' || dir === 'right') {
      for (let y=0;y<4;y++) {
        let row = grid[y].slice();
        if (dir==='right') row.reverse();
        row = slide(row);
        if (dir==='right') row.reverse();
        grid[y] = row;
      }
    } else {
      for (let x=0;x<4;x++) {
        let col = [grid[0][x],grid[1][x],grid[2][x],grid[3][x]];
        if (dir==='down') col.reverse();
        col = slide(col);
        if (dir==='down') col.reverse();
        for (let y=0;y<4;y++) grid[y][x] = col[y];
      }
    }
    if (JSON.stringify(grid) !== before) { addTile(); render(); }
  }
  function handleKey(e) {
    if (!document.body.contains(board)) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','r'].includes(k)) e.preventDefault();
    if (k==='arrowleft'||k==='a') move('left');
    else if (k==='arrowright'||k==='d') move('right');
    else if (k==='arrowup'||k==='w') move('up');
    else if (k==='arrowdown'||k==='s') move('down');
    else if (k==='r') reset();
  }
  document.addEventListener('keydown', handleKey);
  const obs = setInterval(() => {
    if (!document.body.contains(board)) { clearInterval(obs); document.removeEventListener('keydown', handleKey); }
  }, 500);
  reset();
}

function schedBody() {

  `;
}
function initSched(win) {
  const cv = win.querySelector('#schedCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const history = Array(60).fill(0);
  const predicted = Array(60).fill(0);
  const t = setInterval(() => {
    if (!document.body.contains(cv)) { clearInterval(t); return; }
    const base = 30 + Math.sin(performance.now()/800)*15 + Math.random()*20;
    history.push(base); history.shift();
    const pred = base + Math.sin(performance.now()/400)*8 + (Math.random()-0.5)*6;
    predicted.push(Math.max(0,pred)); predicted.shift();
    draw();
  }, 400);
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,215,0,.08)';
    for (let i=0;i<=4;i++){ ctx.beginPath(); ctx.moveTo(0,H/4*i); ctx.lineTo(W,H/4*i); ctx.stroke(); }
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.beginPath();
    history.forEach((v,i)=>{ const x=i*W/60, y=H-(v/100)*H; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
    ctx.strokeStyle='#4ade80'; ctx.setLineDash([4,4]); ctx.beginPath();
    predicted.forEach((v,i)=>{ const x=i*W/60, y=H-(v/100)*H; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke(); ctx.setLineDash([]);
  }
}

/* === ОБНОВЛЕНИЯ: WINDOWS через реальный сервер === */
async function checkWindowsUpdates(win) {
  const logEl = win.querySelector('#updateLog');
  const latestEl = win.querySelector('#updateLatest');
  const downBtn = win.querySelector('#updateDownloadBtn');
  const checkBtn = win.querySelector('#updateCheckBtn');
  if (!logEl) return;
  logEl.innerHTML = '';
  updateLog(logEl, '> Запрос к серверу обновлений...', '');
  updateLog(logEl, '> URL: ' + UPDATE_SERVER, '');
  checkBtn.disabled = true;

  try {
    updateLog(logEl, '> Подключение...', '');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    let response;
    try {
      response = await fetch(UPDATE_SERVER, {
        headers: { 'Accept': 'application/vnd.github+json' },
        signal: controller.signal
      });
    } catch(fetchErr) {
      // Fallback — пробуем другой endpoint
      updateLog(logEl, '⚠ GitHub API недоступен, пробую зеркало...', 'warn');
      try {
        response = await fetch('https://api.github.com/repos/facebook/react/releases/latest', {
          headers: { 'Accept': 'application/vnd.github+json' }
        });
      } catch(e) {
        throw new Error('Нет соединения с сервером');
      }
    } finally {
      clearTimeout(timeout);
    }

    updateLog(logEl, '> HTTP ' + response.status + ' ' + response.statusText, '');

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();
    const version = (data.tag_name || data.name || 'unknown').replace(/^v/, '');
    updateLog(logEl, '> Получены данные:', '');
    updateLog(logEl, '  • Версия: ' + version, '');
    updateLog(logEl, '  • Название: ' + (data.name || 'без названия'), '');
    if (data.published_at) {
      updateLog(logEl, '  • Опубликовано: ' + new Date(data.published_at).toLocaleString('ru-RU'), '');
    }
    if (data.body) {
      updateLog(logEl, '> Описание:', '');
      updateLog(logEl, data.body.slice(0, 400) + (data.body.length > 400 ? '...' : ''), '');
    }

    const cur = CURRENT_VERSION.split('.').map(Number);
    const nw = version.split('.').map(Number);
    let isNewer = false;
    for (let i = 0; i < Math.max(cur.length, nw.length); i++) {
      const a = cur[i] || 0, b = nw[i] || 0;
      if (b > a) { isNewer = true; break; }
      if (b < a) break;
    }

    latestEl.style.display = 'inline-block';
    latestEl.textContent = 'Доступна: ' + version;
    latestEl.style.color = isNewer ? '#fbbf24' : '#4ade80';

    if (isNewer) {
      updateLog(logEl, '✅ Доступно новое обновление: ' + version, '');
      downBtn.style.display = 'inline-block';
      downBtn.onclick = () => downloadWindowsUpdate(win, data);
    } else {
      updateLog(logEl, '✅ Установлена последняя версия (' + CURRENT_VERSION + ')', '');
    }
  } catch(err) {
    updateLog(logEl, '❌ Ошибка: ' + err.message, 'err');
    updateLog(logEl, '💡 Возможные причины: нет интернета, CORS, сервер недоступен', 'warn');
    updateLog(logEl, '💡 Попробуйте ещё раз или проверьте соединение', 'warn');
  } finally {
    checkBtn.disabled = false;
  }
}

/* === ОБНОВЛЕНИЯ: скачивание Windows Update === */
async function downloadWindowsUpdate(win, data) {
  const logEl = win.querySelector('#updateLog');
  const prog = win.querySelector('#updateProgress');
  const fill = win.querySelector('#updateProgressFill');
  if (!logEl || !prog || !fill) return;

  prog.classList.add('show');
  fill.style.width = '0%';
  updateLog(logEl, '\n> Начало загрузки обновления Windows...', '');

  // Если есть URL к ассету в релизе — скачаем реально
  let downloadUrl = null;
  if (data && data.assets && data.assets.length > 0) {
    downloadUrl = data.assets[0].browser_download_url;
    updateLog(logEl, '> Файл: ' + data.assets[0].name, '');
    updateLog(logEl, '> Размер: ' + (data.assets[0].size / 1024 / 1024).toFixed(2) + ' MB', '');
  } else {
    // Демо-загрузка — имитируем прогресс и в конце даём "файл"
    updateLog(logEl, '> Скачивание патча Windows 11 (демо)...', '');
  }

  const steps = [
    'Подключение к серверу обновлений...',
    'Проверка подписи пакета...',
    'Загрузка KB' + (5000000 + Math.floor(Math.random()*1000000)) + '...',
    'Загрузка 25%...',
    'Загрузка 50%...',
    'Загрузка 75%...',
    'Загрузка 100%...',
    'Проверка целостности SHA-256...',
    'Распаковка...',
    'Установка...',
    'Регистрация компонентов...',
    '✅ Обновление установлено (демо)',
    'Перезагрузка не требуется'
  ];

  for (let i = 0; i < steps.length; i++) {
    await new Promise(r => setTimeout(r, 400 + Math.random()*400));
    fill.style.width = ((i+1)/steps.length*100) + '%';
    const isOk = steps[i].startsWith('✅');
    updateLog(logEl, '  ' + steps[i], isOk ? '' : '');

    if (downloadUrl && i === 3) {
      // Реально качаем файл через XHR для прогресса
      try {
        updateLog(logEl, '  → Скачиваю ' + downloadUrl, '');
        const response = await fetch(downloadUrl);
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'update-' + (data.tag_name || 'latest') + '.zip';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        updateLog(logEl, '  → Файл сохранён на компьютер', '');
      } catch(e) {
        updateLog(logEl, '  → Ошибка загрузки: ' + e.message, 'err');
      }
    }
  }

  updateLog(logEl, '\n✅ Готово. Обновление "Windows" скачано (демо-пакет).', '');
  notify('🔄 Обновление', 'Windows Update успешно установлен (демо)');
  toast('✅ Обновление установлено (демо)');
}

/* === ОБНОВЛЕНИЯ: VoltOS Core через GitHub === */
async function checkVoltOSUpdates(win) {
  const logEl = win.querySelector('#voltLog');
  if (!logEl) return;
  logEl.innerHTML = '';
  updateLog(logEl, '> Проверка обновлений VoltOS Core...', '');

  try {
    // Пробуем несколько публичных репозиториев (проверка связи с реальным сервером)
    const endpoints = [
      'https://api.github.com/repos/facebook/react/releases/latest',
      'https://api.github.com/repos/vuejs/core/releases/latest'
    ];

    let data = null;
    for (const url of endpoints) {
      try {
        updateLog(logEl, '> GET ' + url, '');
        const r = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
        updateLog(logEl, '> HTTP ' + r.status, '');
        if (r.ok) {
          data = await r.json();
          break;
        }
      } catch(e) {
        updateLog(logEl, '⚠ ' + e.message, 'warn');
      }
    }

    if (!data) {
      throw new Error('Не удалось получить данные с GitHub');
    }

    updateLog(logEl, '> Последний релиз: ' + (data.tag_name || data.name), '');
    updateLog(logEl, '> Опубликовано: ' + new Date(data.published_at).toLocaleString('ru-RU'), '');
    updateLog(logEl, '> Описание: ' + (data.body || 'нет').slice(0, 200) + '...', '');
    updateLog(logEl, '\n✅ Сервер VoltOS Core доступен', '');
    updateLog(logEl, '✅ Текущая версия: ' + CURRENT_VERSION + ' (актуальна)', '');
    notify('⚡ VoltOS', 'Обновления ядра проверены — актуально');
  } catch(err) {
    updateLog(logEl, '❌ Ошибка: ' + err.message, 'err');
  }
}

  setInterval(() => {
    ctx.clearRect(0,0,200,64);
    const vals = [state.cpu, state.mem/8*100, state.battery];
    const colors = ['#ffd700','#4ade80','#38bdf8'];
    const labels = ['CPU','MEM','BAT'];
    vals.forEach((v,i) => {
      const y = i*20+4;
      ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(0,y,200,12);
      ctx.fillStyle=colors[i]; ctx.fillRect(0,y,Math.min(200,200*v/100),12);
      ctx.fillStyle='#000'; ctx.font='bold 8px sans-serif';
      ctx.fillText(labels[i], 4, y+9);
    });
    const wf = document.getElementById('wFiles');
    const ws = document.getElementById('wSnaps');
    if (wf) wf.textContent = Object.keys(fs).length;
    if (ws) ws.textContent = state.snapshots.length;
  }, 800);
}

/* ============ KEYBOARD ============ */
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'ArrowRight') { e.preventDefault(); switchVD((state.currentVD+1)%state.vdesktops); }
  if (e.ctrlKey && e.key === 'ArrowLeft') { e.preventDefault(); switchVD((state.currentVD-1+state.vdesktops)%state.vdesktops); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); openWindow('terminal'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'u') { e.preventDefault(); pickFileForUpload(); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'm') { e.preventDefault(); openWindow('music'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'b') { e.preventDefault(); openWindow('browser'); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'l') { e.preventDefault(); showLockScreen(); }
  if (e.key === 'Escape') hideContextMenu();
});

document.getElementById('lockBtn').onclick = tryUnlock;
document.getElementById('lockPass').onkeydown = (e) => {
  if (e.key === 'Enter') tryUnlock();
};

renderStats();
</script>
</body>
</html>
